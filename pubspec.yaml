name: albra3m4
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  dartz: ^0.10.1

  # Remote Database
  firebase_auth:
  firebase_core:
  cloud_firestore:

  # Local Database
  sqflite:
  path_provider:
  shared_preferences:

  # Injection
  get_it:

  # State management
  equatable:
  flutter_bloc:
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Somar
      fonts:
        - asset: assets/fonts/SomarRounded-Light.ttf
          weight: 300

        - asset: assets/fonts/SomarRounded-Regular.ttf
          weight: 400

        - asset: assets/fonts/SomarRounded-Medium.ttf
          weight: 500

        - asset: assets/fonts/SomarRounded-Bold.ttf
          weight: 700

        - asset: assets/fonts/SomarRounded-Black.ttf
          weight: 900